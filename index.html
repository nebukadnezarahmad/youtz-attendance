<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Youtz Group Corporation — Smart Attendance Portal</title>
<meta name="description" content="Smart Attendance Portal — Youtz Group Corporation #MedianyaAnakMuda">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #007ED4;
    display: flex; align-items: center; justify-content: center;
    min-height: 100dvh; color: #fff;
  }
  .loader {
    text-align: center; animation: fadeIn 0.3s ease;
  }
  .spinner {
    width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.2);
    border-top-color: #fff; border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  .loader p { font-size: 14px; opacity: 0.8; font-weight: 500; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>
<div class="loader">
  <div class="spinner"></div>
  <p>Mendeteksi perangkat...</p>
</div>
<script>
(function() {
  // Detect mobile via multiple signals
  var isMobile = /Android|iPhone|iPad|iPod|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)
    || (navigator.maxTouchPoints > 0 && window.innerWidth <= 768)
    || window.innerWidth <= 768;

  // Small delay for visual feedback
  setTimeout(function() {
    if (isMobile) {
      window.location.replace('mobile.html');
    } else {
      window.location.replace('desktop.html');
    }
  }, 400);
})();
</script>
</body>
</html>
